name: lab_iot_logbook
description: LabIoTLogbook - Sistem logbook peminjaman alat laboratorium berbasis blockchain.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web3dart: ^3.0.3
  wallet: ^0.0.18
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/abi/lab_iot_blockchain.json
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/splash_logo.jpeg"

  android_12:
    color: "#FFFFFF"
    image: "assets/splash/splash_logo.jpeg"
    icon_background_color: "#FFFFFF"

  android: true
  ios: true
  web: false
